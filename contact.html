<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title id="contact-title">联系 | 溪风设计</title>
<link href="vendor/fontawesome/css/all.min.css" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
<link rel="icon" id="site-favicon"/>
</head>
<body>
<canvas id="spark-canvas"></canvas>
<script src="js/spark.js"></script>

<div id="site-nav"></div>

<header class="page-header">
<div class="page-aurora"></div>
<h1>联系我们</h1>
<p>期待与您的合作</p>
</header>

<section class="container">
<section class="contact-section">
<div class="contact-grid">
<div class="contact-info">
<h2>开始合作</h2>
<p>无论是品牌重塑还是全新项目，我们都能为你提供专业的设计方案。欢迎通过以下方式联系我们，聊聊你的项目需求。</p>
<div class="contact-methods">
<div class="contact-method">
<div class="contact-method-icon"><i class="fas fa-envelope"></i></div>
<div class="contact-method-info">
<h4>电子邮件</h4>
<a href="#" id="contact-email-link">bryanqiu52@gmail.com</a>
</div>
</div>
<div class="contact-method">
<div class="contact-method-icon"><i class="fab fa-weixin"></i></div>
<div class="contact-method-info">
<h4>微信</h4>
<p id="contact-wechat">poke1883</p>
</div>
</div>
<div class="contact-method">
<div class="contact-method-icon"><i class="fas fa-clock"></i></div>
<div class="contact-method-info">
<h4>响应时间</h4>
<p>24小时内回复</p>
</div>
</div>
</div>
</div>
<div class="contact-form">
<form id="contactForm">
<div class="form-group">
<label for="name">您的姓名</label>
<input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
</div>
<div class="form-group">
<label for="email">邮箱地址</label>
<input type="email" id="email" name="email" placeholder="请输入您的邮箱" required>
</div>
<div class="form-group">
<label for="project">项目类型</label>
<input type="text" id="project" name="project" placeholder="如：品牌设计、UI设计等">
</div>
<div class="form-group">
<label for="message">项目描述</label>
<textarea id="message" name="message" placeholder="请简要描述您的项目需求..." required></textarea>
</div>
<button type="submit" class="btn btn-primary" style="width: 100%;">
<span>发送消息</span>
<i class="fas fa-paper-plane"></i>
</button>
</form>
</div>
</div>
</section>

<section class="about-section">
<div class="section-header">
<div class="head-title">
<span class="section-tag">Social</span>
<h2 class="section-title">关注我们</h2>
</div>
<p class="section-desc">在各大平台关注我们，获取更多设计灵感与作品动态</p>
</div>
<div class="services-grid">
<div class="service-card">
<div class="service-icon"><i class="fab fa-behance"></i></div>
<h3>Behance</h3>
<p>查看我们的设计作品集</p>
<a href="#" id="contact-behance-link" target="_blank" class="btn btn-outline" style="margin-top: 1rem;">访问主页</a>
</div>
<div class="service-card">
<div class="service-icon"><i class="fab fa-dribbble"></i></div>
<h3>Dribbble</h3>
<p>探索创意设计作品</p>
<a href="#" id="contact-dribbble-link" target="_blank" class="btn btn-outline" style="margin-top: 1rem;">访问主页</a>
</div>
<div class="service-card">
<div class="service-icon"><i class="fab fa-instagram"></i></div>
<h3>Instagram</h3>
<p>关注我们的日常创作</p>
<a href="#" id="contact-instagram-link" target="_blank" class="btn btn-outline" style="margin-top: 1rem;">访问主页</a>
</div>
</div>
</section>
</section>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof siteConfig !== 'undefined') {
        document.getElementById('contact-title').textContent = '联系 | ' + siteConfig.siteTitle;
        document.getElementById('contact-email-link').textContent = siteConfig.email;
        document.getElementById('contact-email-link').href = 'mailto:' + siteConfig.email;
        document.getElementById('contact-wechat').textContent = siteConfig.wechat;
        
        if (siteConfig.behance) {
            document.getElementById('contact-behance-link').href = siteConfig.behance;
        }
        if (siteConfig.dribbble) {
            document.getElementById('contact-dribbble-link').href = siteConfig.dribbble;
        }
        if (siteConfig.instagram) {
            document.getElementById('contact-instagram-link').href = siteConfig.instagram;
        }
    }
    
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData);
        console.log('表单提交:', data);
        alert('感谢您的留言！我们会尽快回复您。');
        this.reset();
    });
});
</script>
<script src="js/site-ui.js"></script>
<script src="js/aurora.js"></script>
</body>
</html>
