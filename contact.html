<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title id="contact-title">联系 | 溪风设计</title>
<link href="vendor/fontawesome/css/all.min.css" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
<link rel="icon" id="site-favicon"/>
</head>
<body>
<canvas id="spark-canvas"></canvas>
<script src="js/spark.js"></script>

<div id="site-nav"></div>

<header class="page-header">
<div class="page-aurora"></div>
<h1>联系我们</h1>
<p>期待与您的合作</p>
</header>

<section class="container">
<section class="contact-section">
<div class="contact-grid">
<div class="contact-info">
<h2>开始合作</h2>
<p>无论是品牌重塑还是全新项目，我们都能为你提供专业的设计方案。欢迎通过以下方式联系我们，聊聊你的项目需求。</p>
<div class="contact-methods">
<div class="contact-method">
<div class="contact-method-icon"><i class="fas fa-envelope"></i></div>
<div class="contact-method-info">
<h4>电子邮件</h4>
<a href="#" id="contact-email-link">bryanqiu52@gmail.com</a>
</div>
</div>
<div class="contact-method">
<div class="contact-method-icon"><i class="fab fa-weixin"></i></div>
<div class="contact-method-info">
<h4>微信</h4>
<p id="contact-wechat">poke1883</p>
</div>
</div>
<div class="contact-method">
<div class="contact-method-icon"><i class="fas fa-clock"></i></div>
<div class="contact-method-info">
<h4>响应时间</h4>
<p>24小时内回复</p>
</div>
</div>
</div>
</div>
<div class="contact-form">
<form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
<!-- Web3Forms 邮件中转配置：
     提交后由 Web3Forms 将表单内容以邮件发送到站长邮箱（无需自建后端）。
     access_key 在 https://web3forms.com 注册邮箱后生成，对应站长收件邮箱。 -->
<input type="hidden" name="access_key" value="a76d1a6a-52bc-441e-9e35-ab12927b0805">
<input type="hidden" name="subject" id="wf-subject" value="网站联系表单新留言">
<input type="hidden" name="from_name" id="wf-from-name" value="网站访客">
<!-- 蜜罐字段：对用户不可见，机器人自动填写后将被拦截 -->
<input type="text" name="botcheck" id="wf-botcheck" style="display:none !important; visibility:hidden; position:absolute; left:-9999px; width:0; height:0; opacity:0;" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="form-group">
<label for="name">您的姓名</label>
<input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
</div>
<div class="form-group">
<label for="email">邮箱地址</label>
<input type="email" id="email" name="email" placeholder="请输入您的邮箱" required>
</div>
<div class="form-group">
<label for="project">项目类型</label>
<input type="text" id="project" name="project" placeholder="如：品牌设计、UI设计等">
</div>
<div class="form-group">
<label for="message">项目描述</label>
<textarea id="message" name="message" placeholder="请简要描述您的项目需求..." required></textarea>
</div>
<button type="submit" class="btn btn-primary" style="width: 100%;">
<span>发送消息</span>
<i class="fas fa-paper-plane"></i>
</button>
</form>
</div>
</div>
</section>

<section class="about-section">
<div class="section-header">
<div class="head-title">
<span class="section-tag">Social</span>
<h2 class="section-title">关注我们</h2>
</div>
<p class="section-desc">在各大平台关注我们，获取更多设计灵感与作品动态</p>
</div>
<div class="services-grid">
<div class="service-card">
<div class="service-icon"><i class="fab fa-behance"></i></div>
<h3>Behance</h3>
<p>查看我们的设计作品集</p>
<a href="#" id="contact-behance-link" target="_blank" class="btn btn-outline" style="margin-top: 1rem;">访问主页</a>
</div>
<div class="service-card">
<div class="service-icon"><i class="fab fa-dribbble"></i></div>
<h3>Dribbble</h3>
<p>探索创意设计作品</p>
<a href="#" id="contact-dribbble-link" target="_blank" class="btn btn-outline" style="margin-top: 1rem;">访问主页</a>
</div>
<div class="service-card">
<div class="service-icon"><i class="fab fa-instagram"></i></div>
<h3>Instagram</h3>
<p>关注我们的日常创作</p>
<a href="#" id="contact-instagram-link" target="_blank" class="btn btn-outline" style="margin-top: 1rem;">访问主页</a>
</div>
</div>
</section>
</section>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof siteConfig !== 'undefined') {
        document.getElementById('contact-title').textContent = '联系 | ' + siteConfig.siteTitle;
        document.getElementById('contact-email-link').textContent = siteConfig.email;
        document.getElementById('contact-email-link').href = 'mailto:' + siteConfig.email;
        document.getElementById('contact-wechat').textContent = siteConfig.wechat;
        
        if (siteConfig.behance) {
            document.getElementById('contact-behance-link').href = siteConfig.behance;
        }
        if (siteConfig.dribbble) {
            document.getElementById('contact-dribbble-link').href = siteConfig.dribbble;
        }
        if (siteConfig.instagram) {
            document.getElementById('contact-instagram-link').href = siteConfig.instagram;
        }
    }
    
    var contactForm = document.getElementById('contactForm');
    var submitBtn = contactForm.querySelector('button[type="submit"]');
    var btnText = submitBtn.querySelector('span');
    var btnIcon = submitBtn.querySelector('i');
    
    /* 提示消息容器：展示校验/成功/失败/限流信息 */
    var msgBox = document.createElement('div');
    msgBox.id = 'wf-form-message';
    msgBox.style.cssText = 'display:none;margin-top:14px;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;text-align:left;transition:opacity 0.25s ease;';
    contactForm.appendChild(msgBox);
    
    function showMsg(text, ok) {
        msgBox.textContent = text;
        msgBox.style.display = 'block';
        msgBox.style.background = ok ? 'rgba(200,255,62,0.08)' : 'rgba(255,110,110,0.1)';
        msgBox.style.color = ok ? 'var(--secondary)' : '#ff9d9d';
        msgBox.style.border = ok ? '1px solid rgba(200,255,62,0.3)' : '1px solid rgba(255,110,110,0.4)';
    }
    
    /* 基础限流：同一浏览器 60 秒内只允许提交一次 */
    var RATE_LIMIT_KEY = 'wf_last_submit_ts';
    function getRateLimitWait() {
        var last = parseInt(localStorage.getItem(RATE_LIMIT_KEY) || '0', 10);
        if (last && Date.now() - last < 60000) {
            return Math.ceil((60000 - (Date.now() - last)) / 1000);
        }
        return 0;
    }
    
    function setSubmitting(submitting) {
        submitBtn.disabled = submitting;
        if (submitting) {
            btnText.textContent = '发送中...';
            if (btnIcon) btnIcon.style.display = 'none';
        } else {
            btnText.textContent = '发送消息';
            if (btnIcon) btnIcon.style.display = '';
        }
    }
    
    contactForm.addEventListener('submit', function(e) {
        e.preventDefault();
        msgBox.style.display = 'none';
        
        /* 蜜罐检测：隐藏字段被填写（机器人所为）→ 静默假装成功，不发送 */
        var bot = document.getElementById('wf-botcheck');
        if (bot && bot.value.trim() !== '') {
            showMsg('消息已发送，我们会尽快回复', true);
            contactForm.reset();
            return;
        }
        
        /* 限流检测 */
        var wait = getRateLimitWait();
        if (wait > 0) {
            showMsg('发送过于频繁，请稍后再试（' + wait + ' 秒后重试）', false);
            return;
        }
        
        /* 基础校验：必填项非空 + 邮箱格式 */
        var nameVal = document.getElementById('name').value.trim();
        var emailVal = document.getElementById('email').value.trim();
        var projectVal = document.getElementById('project').value.trim();
        var messageVal = document.getElementById('message').value.trim();
        if (!nameVal || !emailVal || !messageVal) {
            showMsg('请填写姓名、邮箱和项目描述', false);
            return;
        }
        var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRe.test(emailVal)) {
            showMsg('请输入有效的邮箱地址', false);
            return;
        }
        
        /* 组装提交数据 */
        var fd = new FormData(contactForm);
        fd.set('subject', '网站联系表单：' + nameVal + (projectVal ? ' - ' + projectVal : ''));
        fd.set('from_name', nameVal);
        
        /* 发送中状态 */
        setSubmitting(true);
        
        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: fd
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data && data.success) {
                localStorage.setItem(RATE_LIMIT_KEY, String(Date.now()));
                showMsg('消息已发送，我们会尽快回复', true);
                contactForm.reset();
            } else {
                showMsg('发送失败：' + ((data && data.message) || '请稍后重试'), false);
            }
        })
        .catch(function() {
            showMsg('网络异常，发送失败，请稍后重试', false);
        })
        .finally(function() {
            setSubmitting(false);
        });
    });
});
</script>
<script src="js/site-ui.js"></script>
<script src="js/aurora.js"></script>
</body>
</html>
