<script>
const ITEMS_PER_PAGE = 6;
let currentPage = 1;
let currentFilter = 'all';
let currentSearch = '';
let displayedWorks = [];

function filterWorks(category) {
    currentFilter = category;
    currentPage = 1;
    applyFilters();
}

function searchWorks(keyword) {
    currentSearch = keyword.toLowerCase().trim();
    currentPage = 1;
    applyFilters();
}

function applyFilters() {
    let filtered = [...projectsData];
    
    if (currentFilter !== 'all') {
        filtered = filtered.filter(work => work.category === currentFilter);
    }
    
    if (currentSearch) {
        filtered = filtered.filter(work => 
            work.title.toLowerCase().includes(currentSearch) ||
            work.description.toLowerCase().includes(currentSearch) ||
            work.tags.some(tag => tag.toLowerCase().includes(currentSearch))
        );
    }
    
    displayedWorks = filtered;
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === currentFilter);
    });

    renderWorks(true);
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    searchWorks('');
}

function renderWorks(reset = false) {
    const container = document.getElementById('portfolioGrid');
    const start = 0;
    const end = currentPage * ITEMS_PER_PAGE;
    const worksToShow = displayedWorks.slice(start, end);

    if (reset) {
        container.innerHTML = '';
    }

    worksToShow.forEach((work, index) => {
        const existingCard = container.querySelector(`[data-id="${work.id}"]`);
        if (existingCard) return;

        const card = document.createElement('a');
        card.href = `project.html?id=${work.id}`;
        card.className = 'portfolio-item';
        card.dataset.id = work.id;
        card.style.animationDelay = `${index * 0.05}s`;

        card.innerHTML = `
            <div class="portfolio-item-image">
                <img src="${work.image}" alt="${work.title}" loading="lazy">
                <div class="portfolio-item-overlay">
                    <span class="portfolio-item-category">${getCategoryName(work.category)}</span>
                </div>
            </div>
            <div class="portfolio-item-info">
                <h3>${work.title}</h3>
                <p>${work.description}</p>
                <span class="portfolio-item-link">
                    查看详情 <i class="fas fa-arrow-right"></i>
                </span>
            </div>
        `;

        container.appendChild(card);
    });

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    if (end < displayedWorks.length) {
        loadMoreBtn.style.display = 'inline-flex';
    } else {
        loadMoreBtn.style.display = 'none';
    }
}

function renderCategoryFilters() {
    const container = document.getElementById('portfolioFilters');
    let html = '<button class="filter-btn active" data-filter="all">全部案例</button>';
    for (const [key, value] of Object.entries(categories)) {
        html += `<button class="filter-btn" data-filter="${key}">${value}</button>`;
    }
    container.innerHTML = html;
    
    container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            filterWorks(this.dataset.filter);
        });
    });
}

document.addEventListener('DOMContentLoaded', function() {
    renderCategoryFilters();
    filterWorks('all');

    document.getElementById('searchInput').addEventListener('input', function() {
        searchWorks(this.value);
    });

    document.getElementById('loadMoreBtn').addEventListener('click', function() {
        currentPage++;
        renderWorks();
    });

    document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
        this.classList.toggle('active');
        document.querySelector('.nav-links').classList.toggle('active');
        document.body.classList.toggle('no-scroll');
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            document.querySelector('.mobile-menu-btn').classList.remove('active');
            document.querySelector('.nav-links').classList.remove('active');
            document.body.classList.remove('no-scroll');
        });
    });
});
</script>
