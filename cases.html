<script>
const ITEMS_PER_PAGE = 8;
let currentPage = 1;
let currentFilter = 'all';
let currentSearch = '';
let displayedWorks = [];

function filterWorks(category) {
    currentFilter = category;
    currentPage = 1;
    applyFilters();
}

function searchWorks(keyword) {
    currentSearch = keyword.toLowerCase().trim();
    currentPage = 1;
    applyFilters();
}

function applyFilters() {
    let filtered = typeof sortProjects === 'function' ? sortProjects(projectsData) : [...projectsData];
    
    if (currentFilter !== 'all') {
        filtered = filtered.filter(work => work.category === currentFilter);
    }
    
    if (currentSearch) {
        filtered = filtered.filter(work => 
            work.title.toLowerCase().includes(currentSearch) ||
            work.description.toLowerCase().includes(currentSearch) ||
            work.tags.some(tag => tag.toLowerCase().includes(currentSearch))
        );
    }
    
    displayedWorks = filtered;
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === currentFilter);
    });

    renderWorks();
    renderPagination();
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    searchWorks('');
}

function renderWorks() {
    const container = document.getElementById('portfolioGrid');
    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const end = start + ITEMS_PER_PAGE;
    const worksToShow = displayedWorks.slice(start, end);
    
    const scrollTop = window.pageYOffset;

    container.innerHTML = '';

    if (worksToShow.length === 0) {
        container.innerHTML = '<div style="color: white; text-align: center; padding: 50px;"><h3>暂无符合条件的案例</h3></div>';
        return;
    }

    worksToShow.forEach((work, index) => {
        const card = document.createElement('a');
        card.href = `project.html?id=${work.id}`;
        card.className = 'portfolio-item';
        card.dataset.id = work.id;
        card.style.animationDelay = `${index * 0.05}s`;

        card.innerHTML = `
            <div class="portfolio-item-image">
                <img src="${work.image}" alt="${work.title}" loading="lazy">
                <div class="portfolio-item-overlay">
                    <span class="portfolio-item-category">${getCategoryName(work.category)}</span>
                </div>
            </div>
            <div class="portfolio-item-info">
                <h3>${work.title}</h3>
                <p>${work.description}</p>
                <span class="portfolio-item-link">
                    查看详情 <i class="fas fa-arrow-right"></i>
                </span>
            </div>
        `;

        container.appendChild(card);
    });
    
    requestAnimationFrame(() => {
        window.scrollTo(0, scrollTop);
    });
}

function renderPagination() {
    const totalPages = Math.ceil(displayedWorks.length / ITEMS_PER_PAGE);
    const paginationContainer = document.getElementById('paginationContainer');
    const paginationNumbers = document.getElementById('paginationNumbers');
    const paginationInfo = document.getElementById('paginationInfo');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');

    if (totalPages <= 1) {
        paginationContainer.style.display = 'none';
        return;
    }

    paginationContainer.style.display = 'flex';

    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;

    paginationNumbers.innerHTML = '';

    const maxVisible = 5;
    
    if (totalPages <= maxVisible) {
        for (let i = 1; i <= totalPages; i++) {
            const button = document.createElement('button');
            button.className = `pagination-btn${i === currentPage ? ' active' : ''}`;
            button.textContent = i;
            button.addEventListener('click', () => {
                currentPage = i;
                applyFilters();
                
            });
            paginationNumbers.appendChild(button);
        }
    } else {
        if (currentPage <= Math.floor(maxVisible / 2) + 1) {
            for (let i = 1; i <= maxVisible - 1; i++) {
                const button = document.createElement('button');
                button.className = `pagination-btn${i === currentPage ? ' active' : ''}`;
                button.textContent = i;
                button.addEventListener('click', () => {
                    currentPage = i;
                    applyFilters();
                });
                paginationNumbers.appendChild(button);
            }
            paginationNumbers.appendChild(document.createTextNode('...'));
            const lastBtn = document.createElement('button');
            lastBtn.className = 'pagination-btn';
            lastBtn.textContent = totalPages;
            lastBtn.addEventListener('click', () => {
                currentPage = totalPages;
                applyFilters();
                
            });
            paginationNumbers.appendChild(lastBtn);
        } else if (currentPage >= totalPages - Math.floor(maxVisible / 2)) {
            const firstBtn = document.createElement('button');
            firstBtn.className = 'pagination-btn';
            firstBtn.textContent = 1;
            firstBtn.addEventListener('click', () => {
                currentPage = 1;
                applyFilters();
                
            });
            paginationNumbers.appendChild(firstBtn);
            paginationNumbers.appendChild(document.createTextNode('...'));
            for (let i = totalPages - maxVisible + 2; i <= totalPages; i++) {
                const button = document.createElement('button');
                button.className = `pagination-btn${i === currentPage ? ' active' : ''}`;
                button.textContent = i;
                button.addEventListener('click', () => {
                    currentPage = i;
                    applyFilters();
                });
                paginationNumbers.appendChild(button);
            }
        } else {
            const firstBtn = document.createElement('button');
            firstBtn.className = 'pagination-btn';
            firstBtn.textContent = 1;
            firstBtn.addEventListener('click', () => {
                currentPage = 1;
                applyFilters();
                
            });
            paginationNumbers.appendChild(firstBtn);
            paginationNumbers.appendChild(document.createTextNode('...'));
            
            for (let i = currentPage - 1; i <= currentPage + 1; i++) {
                const button = document.createElement('button');
                button.className = `pagination-btn${i === currentPage ? ' active' : ''}`;
                button.textContent = i;
                button.addEventListener('click', () => {
                    currentPage = i;
                    applyFilters();
                });
                paginationNumbers.appendChild(button);
            }
            
            paginationNumbers.appendChild(document.createTextNode('...'));
            const lastBtn = document.createElement('button');
            lastBtn.className = 'pagination-btn';
            lastBtn.textContent = totalPages;
            lastBtn.addEventListener('click', () => {
                currentPage = totalPages;
                applyFilters();
                
            });
            paginationNumbers.appendChild(lastBtn);
        }
    }

    const startItem = (currentPage - 1) * ITEMS_PER_PAGE + 1;
    const endItem = Math.min(currentPage * ITEMS_PER_PAGE, displayedWorks.length);
    paginationInfo.textContent = `共 ${displayedWorks.length} 个案例，当前显示 ${startItem}-${endItem} 个`;
}

function handleJumpInput() {
    const input = document.getElementById('jumpInput');
    const totalPages = Math.ceil(displayedWorks.length / ITEMS_PER_PAGE);
    const pageNum = parseInt(input.value);
    
    if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
        currentPage = pageNum;
        applyFilters();
        
    }
    
    input.value = '';
}

function goToPrevPage() {
    if (currentPage > 1) {
        currentPage--;
        applyFilters();
        
    }
}

function goToNextPage() {
    const totalPages = Math.ceil(displayedWorks.length / ITEMS_PER_PAGE);
    if (currentPage < totalPages) {
        currentPage++;
        applyFilters();
        
    }
}

function renderCategoryFilters() {
    const container = document.getElementById('portfolioFilters');
    let html = '<button class="filter-btn active" data-filter="all">全部案例</button>';
    for (const [key, value] of Object.entries(categories)) {
        html += `<button class="filter-btn" data-filter="${key}">${value}</button>`;
    }
    container.innerHTML = html;
    
    container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            filterWorks(this.dataset.filter);
        });
    });
}

document.addEventListener('DOMContentLoaded', function() {
    renderCategoryFilters();
    filterWorks('all');

    document.getElementById('searchInput').addEventListener('input', function() {
        searchWorks(this.value);
    });

    document.getElementById('prevPageBtn').addEventListener('click', goToPrevPage);
    document.getElementById('nextPageBtn').addEventListener('click', goToNextPage);
    
    document.getElementById('jumpInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            handleJumpInput();
        }
    });

    document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
        this.classList.toggle('active');
        document.querySelector('.nav-links').classList.toggle('active');
        document.body.classList.toggle('no-scroll');
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            document.querySelector('.mobile-menu-btn').classList.remove('active');
            document.querySelector('.nav-links').classList.remove('active');
            document.body.classList.remove('no-scroll');
        });
    });

    const themeToggle = document.getElementById('themeToggle');
    const isLightTheme = localStorage.getItem('theme') === 'light';
    
    if (isLightTheme) {
        document.body.classList.add('theme-light');
        themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
    }
    
    themeToggle.addEventListener('click', function() {
        const isLight = document.body.classList.toggle('theme-light');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        themeToggle.innerHTML = isLight ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    });
});
</script>
