<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>博客详情 | 溪风设计</title>
<link href="vendor/fontawesome/css/all.min.css" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
<link rel="icon" id="site-favicon"/>
</head>
<body>
<canvas id="spark-canvas"></canvas>
<script src="js/spark.js"></script>

<div id="site-nav"></div>

<article class="blog-detail" id="blogDetail">
</article>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="vendor/marked/marked.min.js"></script>
<script>
function getUrlParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
}

// 配置 marked.js：启用 GitHub 风格 markdown（表格、删除线、嵌套列表）
// 关闭 marked 自带的 headerIds/mangle，由 buildToc 统一加锚点 id
if (typeof marked !== 'undefined' && marked.setOptions) {
    marked.setOptions({
        breaks: true,
        gfm: true,
        headerIds: false,
        mangle: false
    });
}

// 解析 markdown：先剥掉 front matter（--- ... ---），再用 marked.js 渲染
// marked 支持完整语法：表格、嵌套列表、代码块、引用、脚注等，AI 写的复杂 md 也能正常显示
function parseMarkdown(md) {
    let body = md.replace(/^---\s*\n[\s\S]*?\n---\s*\n?/, '').trim();
    if (typeof marked !== 'undefined') {
        try {
            return marked.parse(body);
        } catch (e) {
            console.error('marked 解析失败，回退纯文本:', e);
        }
    }
    // 回退：转义后用 pre 包裹，至少不会渲染崩
    return '<pre>' + body.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>';
}

async function renderBlogDetail() {
    const slug = getUrlParam('slug');
    
    if (!slug) {
        document.getElementById('blogDetail').innerHTML = `
            <div class="container" style="padding: 100px 40px; text-align: center;">
                <h2>文章未找到</h2>
                <p>缺少文章标识</p>
                <a href="blog.html" class="btn btn-primary" style="margin-top: 20px;">返回博客列表</a>
            </div>
        `;
        return;
    }

    const posts = await loadBlogPostsData();
    window.blogPosts = posts;
    const post = blogPosts.find(p => p.slug === slug);
    
    if (!post) {
        document.getElementById('blogDetail').innerHTML = `
            <div class="container" style="padding: 100px 40px; text-align: center;">
                <h2>文章未找到</h2>
                <p>该博客文章不存在或已被删除</p>
                <a href="blog.html" class="btn btn-primary" style="margin-top: 20px;">返回博客列表</a>
            </div>
        `;
        return;
    }

    const content = await loadBlogContent(slug);
    const parsedHtml = parseMarkdown(content);
    const toc = buildToc(parsedHtml);
    const htmlContent = toc.html;
    const readMinutes = estimateReadMinutes(parsedHtml);

    document.title = `${post.title} | 溪风设计`;

    // 上一篇 / 下一篇：按日期降序排列取相邻文章
    const byDate = [...blogPosts].sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0));
    const currentIdx = byDate.findIndex(p => p.slug === slug);
    const prevPost = currentIdx >= 0 && currentIdx < byDate.length - 1 ? byDate[currentIdx + 1] : null;
    const nextPost = currentIdx > 0 ? byDate[currentIdx - 1] : null;

    // 相关文章：同分类优先，取 3 篇
    const relatedPosts = [
        ...blogPosts.filter(p => p.slug !== slug && p.category === post.category),
        ...blogPosts.filter(p => p.slug !== slug && p.category !== post.category)
    ].slice(0, 3);
    const relatedPostsHtml = relatedPosts.map(p => `
        <a href="blog-detail.html?slug=${p.slug}" class="sidebar-post-item related-post">
            <div class="sidebar-post-image">
                <img src="${p.cover}" alt="${p.title}">
            </div>
            <div class="sidebar-post-info">
                <span class="sidebar-post-category">${p.category}</span>
                <h4>${p.title}</h4>
            </div>
        </a>
    `).join('');

    const tocHtml = toc.items.length ? `
        <nav class="sidebar-section toc" id="blogToc">
            <h3><i class="fas fa-list-ul"></i> 文章目录</h3>
            <ul>
                ${toc.items.map(it => `<li class="toc-${it.tag}"><a href="#${it.id}">${it.text}</a></li>`).join('')}
            </ul>
        </nav>
    ` : '';

    document.getElementById('blogDetail').innerHTML = `
        <header class="blog-detail-header">
            <div class="container">
                <nav class="breadcrumb" aria-label="面包屑导航">
                    <a href="index.html">首页</a>
                    <span class="breadcrumb-sep">›</span>
                    <a href="blog.html">博客</a>
                    <span class="breadcrumb-sep">›</span>
                    <span class="breadcrumb-current">${post.title}</span>
                </nav>
                <span class="blog-detail-category">${post.category}</span>
                <h1>${post.title}</h1>
                <div class="blog-detail-meta">
                    <span class="blog-detail-author">
                        <span class="author-avatar">${(post.author || '设').charAt(0)}</span>
                        ${post.author}
                    </span>
                    <span class="meta-dot">·</span>
                    <span class="blog-detail-date"><i class="far fa-calendar-alt"></i> ${post.date}</span>
                    <span class="meta-dot">·</span>
                    <span class="blog-detail-readtime"><i class="far fa-clock"></i> ${readMinutes} 分钟阅读</span>
                </div>
            </div>
        </header>
        
        <div class="blog-detail-image">
            <img src="${post.cover}" alt="${post.title}">
        </div>
        
        <div class="container article-container">
            <div class="blog-detail-wrapper">
                <section class="blog-detail-content">
                    ${htmlContent}
                </section>
                
                <aside class="blog-sidebar">
                    ${tocHtml}
                </aside>
            </div>
        </div>
        
        <section class="blog-detail-end">
            <div class="container">
                <nav class="blog-pager" aria-label="上一篇 / 下一篇">
                    ${prevPost ? `
                    <a class="blog-pager-link prev" href="blog-detail.html?slug=${prevPost.slug}">
                        <span class="pager-label"><i class="fas fa-arrow-left"></i> 上一篇</span>
                        <span class="pager-title">${prevPost.title}</span>
                    </a>` : '<span class="blog-pager-link placeholder"></span>'}
                    ${nextPost ? `
                    <a class="blog-pager-link next" href="blog-detail.html?slug=${nextPost.slug}">
                        <span class="pager-label">下一篇 <i class="fas fa-arrow-right"></i></span>
                        <span class="pager-title">${nextPost.title}</span>
                    </a>` : '<span class="blog-pager-link placeholder"></span>'}
                </nav>
                ${relatedPostsHtml ? `
                <div class="related-posts">
                    <h3 class="related-posts-title"><i class="fas fa-file-alt"></i> 相关文章</h3>
                    <div class="related-posts-grid">
                        ${relatedPostsHtml}
                    </div>
                </div>` : ''}
                <div class="blog-end-back">
                    <a href="blog.html" class="btn btn-outline">
                        <i class="fas fa-arrow-left"></i> 返回博客列表
                    </a>
                </div>
            </div>
        </section>
    `;

    initToc();
}

// 从正文 HTML 提取 h2/h3 生成目录（并给标题加锚点 id）
function buildToc(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const headings = doc.querySelectorAll('h2, h3');
    const items = [];
    headings.forEach((h, idx) => {
        const id = 'blog-sec-' + idx;
        h.id = id;
        items.push({ id: id, tag: h.tagName.toLowerCase(), text: (h.textContent || '').trim() });
    });
    // 标记正文首个非空段落为 lead（引言样式）
    const paras = doc.querySelectorAll('p');
    for (let i = 0; i < paras.length; i++) {
        if (paras[i].textContent.trim()) {
            paras[i].classList.add('blog-lead');
            break;
        }
    }
    return { items: items, html: doc.body.innerHTML };
}

// 估算阅读时长（约 300 字/分钟）
function estimateReadMinutes(html) {
    const text = html.replace(/<[^>]+>/g, '').replace(/\s+/g, '');
    return Math.max(1, Math.round(text.length / 300));
}

// 目录交互：点击平滑滚动 + 滚动高亮当前章节
function initToc() {
    const toc = document.getElementById('blogToc');
    if (!toc) return;
    const links = Array.prototype.slice.call(toc.querySelectorAll('a'));
    const headings = links.map(a => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
    if (!headings.length) return;

    links.forEach(a => {
        a.addEventListener('click', function(e) {
            e.preventDefault();
            const target = document.getElementById(a.getAttribute('href').slice(1));
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            links.forEach(l => l.classList.remove('active'));
            a.classList.add('active');
        });
    });

    var ticking = false;
    function update() {
        ticking = false;
        const probe = window.innerHeight * 0.25;
        let currentId = null;
        headings.forEach(h => {
            if (h.getBoundingClientRect().top <= probe) currentId = h.id;
        });
        if (!currentId && headings.length) currentId = headings[0].id;
        links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + currentId));
    }
    function onScroll() {
        if (!ticking) {
            ticking = true;
            requestAnimationFrame(update);
        }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    update();
}

document.addEventListener('DOMContentLoaded', function() {
    renderBlogDetail();

});
</script>
<script src="js/config.js"></script>
<script src="js/site-ui.js"></script>
<script src="js/aurora.js"></script>
</body>
</html>
