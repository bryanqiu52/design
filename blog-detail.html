<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>博客详情 | 溪风设计</title>
<link href="vendor/fontawesome/css/all.min.css" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
<link rel="icon" id="site-favicon"/>
</head>
<body>
<canvas id="spark-canvas"></canvas>
<script src="js/spark.js"></script>

<div id="site-nav"></div>

<article class="blog-detail" id="blogDetail">
</article>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script>
function getUrlParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
}

function parseMarkdown(md) {
    let html = md;
    
    html = html.replace(/^---[\s\S]*?---$/m, '');
    
    html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
    
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
    
    html = html.replace(/!\[(.*?)\]\((.*?)\)/g, function(match, alt, src) {
        if (src.startsWith('http') || src.startsWith('/')) {
            return '<img src="' + src + '" alt="' + alt + '" class="blog-detail-img">';
        }
        return '<img src="../' + src + '" alt="' + alt + '" class="blog-detail-img">';
    });
    
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    
    html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');
    
    html = html.replace(/^(\d+)\. (.*$)/gim, '<li>$2</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ol>$1</ol>');
    
    html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
    
    html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    
    html = html.replace(/^\s*$/gm, '</p><p>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<\/p><p>\s*<\/p><p>\s*/g, '</p><p>');
    html = html.replace(/<\/p>\s*<p>/g, '</p><p>');
    html = html.replace(/<p><\/p>/g, '');
    
    return html.trim();
}

async function renderBlogDetail() {
    const slug = getUrlParam('slug');
    
    if (!slug) {
        document.getElementById('blogDetail').innerHTML = `
            <div class="container" style="padding: 100px 40px; text-align: center;">
                <h2>文章未找到</h2>
                <p>缺少文章标识</p>
                <a href="blog.html" class="btn btn-primary" style="margin-top: 20px;">返回博客列表</a>
            </div>
        `;
        return;
    }

    const posts = await loadBlogPostsData();
    window.blogPosts = posts;
    const post = blogPosts.find(p => p.slug === slug);
    
    if (!post) {
        document.getElementById('blogDetail').innerHTML = `
            <div class="container" style="padding: 100px 40px; text-align: center;">
                <h2>文章未找到</h2>
                <p>该博客文章不存在或已被删除</p>
                <a href="blog.html" class="btn btn-primary" style="margin-top: 20px;">返回博客列表</a>
            </div>
        `;
        return;
    }

    const content = await loadBlogContent(slug);
    const htmlContent = parseMarkdown(content);

    document.title = `${post.title} | 溪风设计`;

    const otherPosts = blogPosts.filter(p => p.slug !== slug).slice(0, 3);
    const otherPostsHtml = otherPosts.map(p => `
        <a href="blog-detail.html?slug=${p.slug}" class="sidebar-post-item">
            <div class="sidebar-post-image">
                <img src="${p.cover}" alt="${p.title}">
            </div>
            <div class="sidebar-post-info">
                <span class="sidebar-post-category">${p.category}</span>
                <h4>${p.title}</h4>
            </div>
        </a>
    `).join('');

    document.getElementById('blogDetail').innerHTML = `
        <header class="blog-detail-header">
            <div class="container">
                <span class="blog-detail-category">${post.category}</span>
                <h1>${post.title}</h1>
                <div class="blog-detail-meta">
                    <span class="blog-detail-author">${post.author}</span>
                    <span class="blog-detail-date">${post.date}</span>
                </div>
            </div>
        </header>
        
        <div class="blog-detail-image">
            <img src="${post.cover}" alt="${post.title}">
        </div>
        
        <div class="container">
            <div class="blog-detail-wrapper">
                <section class="blog-detail-content">
                    ${htmlContent}
                </section>
                
                <aside class="blog-sidebar">
                    <div class="sidebar-section">
                        <h3><i class="fas fa-file-alt"></i> 其他文章</h3>
                        <div class="sidebar-posts">
                            ${otherPostsHtml}
                        </div>
                    </div>
                </aside>
            </div>
        </div>
        
        <section class="blog-detail-nav">
            <div class="container">
                <a href="blog.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> 返回博客列表
                </a>
            </div>
        </section>
    `;
}

document.addEventListener('DOMContentLoaded', function() {
    renderBlogDetail();

});
</script>
<script src="js/config.js"></script>
<script src="js/site-ui.js"></script>
<script src="js/aurora.js"></script>
</body>
</html>
