function getUrlParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
}

function parseMarkdown(md) {
    let html = md;
    
    html = html.replace(/^---[\s\S]*?---$/m, '');
    
    html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
    
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
    
    html = html.replace(/!\[(.*?)\]\((.*?)\)/g, function(match, alt, src) {
        if (src.startsWith('http') || src.startsWith('/')) {
            return '<img src="' + src + '" alt="' + alt + '" class="blog-detail-img">';
        }
        return '<img src="../' + src + '" alt="' + alt + '" class="blog-detail-img">';
    });
    
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    
    html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');
    
    html = html.replace(/^(\d+)\. (.*$)/gim, '<li>$2</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ol>$1</ol>');
    
    html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
    
    html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    
    html = html.replace(/^\s*$/gm, '</p><p>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<\/p><p>\s*<\/p><p>\s*/g, '</p><p>');
    html = html.replace(/<\/p>\s*<p>/g, '</p><p>');
    html = html.replace(/<p><\/p>/g, '');
    
    return html.trim();
}

async function renderBlogDetail() {
    const slug = getUrlParam('slug');
    
    if (!slug) {
        document.getElementById('blogDetail').innerHTML = `
            <div class="container" style="padding: 100px 40px; text-align: center;">
                <h2>文章未找到</h2>
                <p>缺少文章标识</p>
                <a href="blog.html" class="btn btn-primary" style="margin-top: 20px;">返回博客列表</a>
            </div>
        `;
        return;
    }

    const posts = await loadBlogPostsData();
    window.blogPosts = posts;
    const post = blogPosts.find(p => p.slug === slug);
    
    if (!post) {
        document.getElementById('blogDetail').innerHTML = `
            <div class="container" style="padding: 100px 40px; text-align: center;">
                <h2>文章未找到</h2>
                <p>该博客文章不存在或已被删除</p>
                <a href="blog.html" class="btn btn-primary" style="margin-top: 20px;">返回博客列表</a>
            </div>
        `;
        return;
    }

    const content = await loadBlogContent(slug);
    const htmlContent = parseMarkdown(content);

    document.title = `${post.title} | 城南设计工作室`;

    document.getElementById('blogDetail').innerHTML = `
        <header class="blog-detail-header">
            <div class="container">
                <span class="blog-detail-category">${post.category}</span>
                <h1>${post.title}</h1>
                <div class="blog-detail-meta">
                    <span class="blog-detail-author">${post.author}</span>
                    <span class="blog-detail-date">${post.date}</span>
                </div>
            </div>
        </header>
        
        <div class="blog-detail-image">
            <img src="${post.cover}" alt="${post.title}">
        </div>
        
        <section class="blog-detail-content">
            <div class="container">
                ${htmlContent}
            </div>
        </section>
        
        <section class="blog-detail-nav">
            <div class="container">
                <a href="blog.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> 返回博客列表
                </a>
            </div>
        </section>
    `;
}

document.addEventListener('DOMContentLoaded', function() {
    renderBlogDetail();

    document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
        this.classList.toggle('active');
        document.querySelector('.nav-links').classList.toggle('active');
        document.body.classList.toggle('no-scroll');
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            document.querySelector('.mobile-menu-btn').classList.remove('active');
            document.querySelector('.nav-links').classList.remove('active');
            document.body.classList.remove('no-scroll');
        });
    });
});
</script>
