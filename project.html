function getUrlParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

function renderProject(project) {
    const currentIndex = projectsData.findIndex(p => p.id === project.id);
    const prevProject = currentIndex > 0 ? projectsData[currentIndex - 1] : null;
    const nextProject = currentIndex < projectsData.length - 1 ? projectsData[currentIndex + 1] : null;
    
    document.title = `${project.title} | 城南设计工作室`;
    
    const html = `
        <section class="project-hero">
            <div class="project-hero-bg" style="background-image: url('${project.image}')"></div>
            <div class="project-hero-content">
                <span class="project-category">${project.categoryName}</span>
                <h1>${project.title}</h1>
                <p>${project.subtitle}</p>
            </div>
        </section>
        
        <div class="project-meta">
            <div class="project-meta-item">
                <span>客户</span>
                <span>${project.client}</span>
            </div>
            <div class="project-meta-item">
                <span>时间</span>
                <span>${project.year}</span>
            </div>
            <div class="project-meta-item">
                <span>周期</span>
                <span>${project.duration}</span>
            </div>
            <div class="project-meta-item">
                <span>服务</span>
                <span>${project.services.join(' / ')}</span>
            </div>
        </div>
        
        <section class="container">
            <div class="project-content">
                <div class="project-section" data-animate>
                    <h2>项目概述</h2>
                    <p>${project.description}</p>
                </div>
                
                <div class="project-section" data-animate>
                    <h2>作品展示</h2>
                    <div class="project-gallery">
                        ${project.gallery.map((img, i) => `
                            <img src="${img}" alt="${project.title}" loading="lazy">
                        `).join('')}
                    </div>
                </div>
                
                <div class="project-section" data-animate>
                    <h2>挑战与解决方案</h2>
                    <p><strong>项目挑战：</strong>${project.challenge}</p>
                    <p style="margin-top: 1rem;"><strong>解决方案：</strong>${project.solution}</p>
                </div>
                
                <div class="project-section" data-animate>
                    <h2>核心亮点</h2>
                    <div class="project-features">
                        ${project.features.map(f => `
                            <div class="project-feature">
                                <i class="fas ${f.icon}"></i>
                                <h4>${f.title}</h4>
                                <p>${f.description}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="project-section" data-animate>
                    <h2>项目成果</h2>
                    <div class="project-results">
                        ${project.results.map(r => `
                            <div class="project-result">
                                <div class="project-result-number">${r.number}</div>
                                <div class="project-result-label">${r.label}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="project-section" data-animate>
                    <h2>技术标签</h2>
                    <div style="display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1rem;">
                        ${project.tags.map(tag => `<span class="skill-tag">${tag}</span>`).join('')}
                    </div>
                </div>
                
                <div class="project-nav">
                    ${prevProject ? `
                        <a href="project.html?id=${prevProject.id}" class="project-nav-link">
                            <i class="fas fa-arrow-left"></i>
                            <span>上一个</span>
                            <span>${prevProject.title}</span>
                        </a>
                    ` : '<div></div>'}
                    
                    ${nextProject ? `
                        <a href="project.html?id=${nextProject.id}" class="project-nav-link next">
                            <span>下一个</span>
                            <span>${nextProject.title}</span>
                            <i class="fas fa-arrow-right"></i>
                        </a>
                    ` : '<div></div>'}
                </div>
                
                <a href="portfolio.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    <span>返回案例</span>
                </a>
            </div>
        </section>
    `;
    
    document.getElementById('projectContent').innerHTML = html;
    
    setTimeout(() => {
        const elements = document.querySelectorAll('[data-animate]');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate-in');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });
        elements.forEach(el => observer.observe(el));
    }, 100);
}

document.addEventListener('DOMContentLoaded', function() {
    const projectId = parseInt(getUrlParam('id'));
    const project = projectsData.find(p => p.id === projectId) || projectsData[0];
    renderProject(project);
    
    document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
        this.classList.toggle('active');
        document.querySelector('.nav-links').classList.toggle('active');
        document.body.classList.toggle('no-scroll');
    });
    
    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            document.querySelector('.mobile-menu-btn').classList.remove('active');
            document.querySelector('.nav-links').classList.remove('active');
            document.body.classList.remove('no-scroll');
        });
    });
});
</script>
</body>
</html>
