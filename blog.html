<script>
async function renderBlogList() {
    const container = document.getElementById('blogList');
    
    const posts = await loadBlogPostsData();
    window.blogPosts = posts;
    
    if (!window.blogPosts || blogPosts.length === 0) {
        container.innerHTML = '<div style="color: white; text-align: center; padding: 50px;"><h3>暂无博客文章</h3></div>';
        return;
    }
    
    container.innerHTML = blogPosts.map((post, index) => `
        <article class="news-item">
            <div class="news-image">
                <a href="blog-detail.html?slug=${post.slug}">
                    <img src="${post.cover}" alt="${post.title}" loading="lazy">
                </a>
            </div>
            <div class="news-content">
                <h3><a href="blog-detail.html?slug=${post.slug}">${post.title}</a></h3>
                <p>${post.excerpt}</p>
                <div class="news-meta">
                    <span class="news-author"><i class="fas fa-user"></i> ${post.author}</span>
                    <span class="news-date"><i class="far fa-calendar"></i> ${post.date}</span>
                    <span class="news-category">${post.category}</span>
                </div>
            </div>
            <div class="news-action">
                <a href="blog-detail.html?slug=${post.slug}" class="btn btn-primary btn-sm">阅读全文</a>
            </div>
        </article>
    `).join('');
}

document.addEventListener('DOMContentLoaded', function() {
    renderBlogList();

    document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
        this.classList.toggle('active');
        document.querySelector('.nav-links').classList.toggle('active');
        document.body.classList.toggle('no-scroll');
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            document.querySelector('.mobile-menu-btn').classList.remove('active');
            document.querySelector('.nav-links').classList.remove('active');
            document.body.classList.remove('no-scroll');
        });
    });
});
</script>
